<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#07051a" />
    <meta name="description" content="Warrior Blast — puzzle de bloques con combos." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Warrior Blast" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <title>Warrior Blast</title>
    <style>
      html, body { margin: 0; height: 100%; background: #07051a; overflow: hidden; }
      #splash { position: fixed; inset: 0; display: grid; place-items: center; background: #07051a; z-index: 100; transition: opacity .5s; }
      #splash.gone { opacity: 0; pointer-events: none; }
      #splash .sq { width: 54px; height: 54px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; animation: spin 1.2s ease-in-out infinite; }
      #splash .sq i { border-radius: 6px; background: #20d6ff; box-shadow: 0 0 14px #20d6ff; }
      #splash .sq i:nth-child(2) { background: #ff2e88; box-shadow: 0 0 14px #ff2e88; }
      #splash .sq i:nth-child(3) { background: #39ff7a; box-shadow: 0 0 14px #39ff7a; }
      #splash .sq i:nth-child(4) { background: #ffae00; box-shadow: 0 0 14px #ffae00; }
      @keyframes spin { 50% { transform: rotate(90deg) scale(.85); } 100% { transform: rotate(180deg); } }
    </style>
  </head>
  <body>
    <div id="splash"><div class="sq"><i></i><i></i><i></i><i></i></div></div>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
