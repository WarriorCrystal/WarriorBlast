<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Warrior Blast · Editor de niveles</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      body { margin: 0; background: #0c0a20; color: #eee; display: flex; justify-content: center; }
      main { width: min(100%, 760px); padding: 16px; display: grid; gap: 16px; }
      h1 { margin: 0; font-size: 22px; }
      .row { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
      #grid { display: grid; grid-template-columns: repeat(8, 40px); gap: 3px; background: #1a1640; padding: 8px; border-radius: 10px; user-select: none; }
      #grid div { width: 40px; height: 40px; border-radius: 6px; display: grid; place-items: center; font-weight: 800; cursor: pointer; background: #262150; }
      .pal { display: flex; flex-wrap: wrap; gap: 6px; max-width: 360px; }
      .pal button { min-width: 44px; height: 40px; border-radius: 8px; border: 2px solid transparent; font-weight: 800; color: #fff; cursor: pointer; }
      .pal button.on { border-color: #fff; }
      fieldset { border: 1px solid #3a3470; border-radius: 10px; display: grid; gap: 8px; }
      label { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
      input, select { background: #1a1640; color: #fff; border: 1px solid #3a3470; border-radius: 6px; padding: 6px; width: 110px; }
      textarea { width: 100%; height: 260px; background: #07051a; color: #9ff; border-radius: 10px; border: 1px solid #3a3470; font-family: ui-monospace, monospace; padding: 10px; box-sizing: border-box; }
      .btns { display: flex; gap: 8px; }
      .btns button { padding: 10px 16px; border-radius: 10px; border: 0; font-weight: 800; cursor: pointer; background: #20d6ff; color: #000; }
      small { color: #9c97c9; }
    </style>
  </head>
  <body>
    <main>
      <h1>Editor de niveles</h1>
      <small>Elige una pieza de la paleta y haz clic (o arrastra) sobre el tablero. Copia el código generado en <code>src/levels/levels.ts</code>.</small>
      <div class="row">
        <div id="grid"></div>
        <div class="pal" id="pal"></div>
      </div>
      <fieldset>
        <legend>Nivel</legend>
        <label>ID <input id="id" type="number" value="31" /></label>
        <label>Movimientos (vacío = sin límite) <input id="moves" type="number" /></label>
        <label>Dificultad 0..1 <input id="diff" type="number" step="0.05" value="0.3" /></label>
        <label>Prob. gema por pieza <input id="gem" type="number" step="0.05" value="0" /></label>
        <label>Puntos para 2★ <input id="s2" type="number" value="1500" /></label>
        <label>Puntos para 3★ <input id="s3" type="number" value="2500" /></label>
        <label>Objetivo puntos <input id="g-score" type="number" /></label>
        <label>Objetivo líneas <input id="g-lines" type="number" /></label>
        <label>Objetivo gemas <input id="g-gems" type="number" /></label>
        <label>Objetivo combo <input id="g-combo" type="number" /></label>
        <label>Limpiar dianas (X) <select id="g-targets"><option value="">no</option><option value="1">sí</option></select></label>
      </fieldset>
      <div class="btns"><button id="copy">Copiar código</button><button id="test">Probar en el juego</button><button id="clear">Vaciar</button></div>
      <textarea id="out" readonly></textarea>
    </main>
    <script type="module" src="/src/editor.ts"></script>
  </body>
</html>
